name: ifri-admissions

x-health: &health
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 15s

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [internal]
    healthcheck:
      <<: *health
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']

  redis:
    image: redis:8.10.2-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: [/bin/sh, -ec, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis-data:/data
    networks: [internal]
    healthcheck:
      <<: *health
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']

  minio:
    build:
      context: ./infra/minio
      target: server
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    command: [server, /data, --console-address, ':9001']
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio-data:/data
    networks: [internal, local]
    healthcheck:
      <<: *health
      test: [CMD, wget, -q, --spider, http://127.0.0.1:9000/minio/health/ready]

  minio-init:
    build:
      context: ./infra/minio
      target: client
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:?Set MINIO_BUCKET in .env}
      MC_CONFIG_DIR: /tmp/mc
    command:
      - -ec
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        mc anonymous set none "local/$$MINIO_BUCKET"
        mc anonymous get "local/$$MINIO_BUCKET"
    depends_on:
      minio: {condition: service_healthy}
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    restart: 'no'

  api:
    build: ./services/api
    environment: &api-environment
      APP_ENV: ${APP_ENV:?Set APP_ENV in .env}
      API_HOST: '0.0.0.0'
      API_PORT: '8080'
      DRAFT_SESSION_TTL_SECONDS: ${DRAFT_SESSION_TTL_SECONDS:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN in .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:?Set POSTGRES_SSLMODE in .env}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      REDIS_TLS: ${REDIS_TLS:?Set REDIS_TLS in .env}
      MINIO_ENDPOINT: http://minio:9000
    ports:
      - "127.0.0.1:${API_PORT:-18080}:8080"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    networks: [internal, local]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      <<: *health
      test: [CMD, api, healthcheck]

  references-tests:
    profiles: [test]
    build:
      context: ./services/api
      target: test
    environment:
      <<: *api-environment
      APP_ENV: test
    depends_on:
      postgres: {condition: service_healthy}
    networks: [internal]
    restart: 'no'

  ocr-worker:
    build: ./services/ocr
    environment:
      APP_ENV: ${APP_ENV:?Set APP_ENV in .env}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      REDIS_TLS: ${REDIS_TLS:?Set REDIS_TLS in .env}
    depends_on:
      redis: {condition: service_healthy}
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      <<: *health
      test: [CMD, python, -m, ifri_ocr.worker, healthcheck]

networks:
  internal:
    internal: true
  # A non-internal bridge is required for Docker to publish host ports.
  # Explicit 127.0.0.1 bindings above keep them local to the developer host.
  local:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:

name: ifri-admissions

x-health: &health
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 15s

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [internal]
    healthcheck:
      <<: *health
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']

  redis:
    image: redis:8.10.2-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: [/bin/sh, -ec, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis-data:/data
    networks: [internal]
    healthcheck:
      <<: *health
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']

  minio:
    build:
      context: ./infra/minio
      target: server
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    command: [server, /data, --console-address, ':9001']
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio-data:/data
    networks: [internal, local]
    healthcheck:
      <<: *health
      test: [CMD, wget, -q, --spider, http://127.0.0.1:9000/minio/health/ready]

  minio-init:
    build:
      context: ./infra/minio
      target: client
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:?Set MINIO_BUCKET in .env}
      MC_CONFIG_DIR: /tmp/mc
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
    command:
      - -ec
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        mc anonymous set none "local/$$MINIO_BUCKET"
        mc anonymous get "local/$$MINIO_BUCKET"
        cat > /tmp/documents-policy.json <<POLICY
        {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::$$MINIO_BUCKET/applications/*"]}]}
        POLICY
        mc admin user add local "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"
        mc admin policy create local ifri-documents-api /tmp/documents-policy.json
        mc admin policy attach local ifri-documents-api --user "$$S3_ACCESS_KEY"
    depends_on:
      minio: {condition: service_healthy}
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    restart: 'no'

  api:
    build: ./services/api
    environment: &api-environment
      APP_ENV: ${APP_ENV:?Set APP_ENV in .env}
      API_HOST: '0.0.0.0'
      API_PORT: '8080'
      DRAFT_SESSION_TTL_SECONDS: ${DRAFT_SESSION_TTL_SECONDS:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN in .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:?Set POSTGRES_SSLMODE in .env}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      REDIS_TLS: ${REDIS_TLS:?Set REDIS_TLS in .env}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:?Set MINIO_BUCKET}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      DOCUMENT_MAX_BYTES: ${DOCUMENT_MAX_BYTES:-}
      OCR_INTERNAL_SECRET: ${OCR_INTERNAL_SECRET:?Set OCR_INTERNAL_SECRET}
      OCR_MIN_CONFIDENCE: ${OCR_MIN_CONFIDENCE:-0.85}
      OCR_SCAN_DPI: ${OCR_SCAN_DPI:-300}
      OCR_SCAN_RETRY_DPI: ${OCR_SCAN_RETRY_DPI:-350}
      OCR_SCAN_MAX_PASSES: ${OCR_SCAN_MAX_PASSES:-3}

    ports:
      - "127.0.0.1:${API_PORT:-18080}:8080"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    networks: [internal, local]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      <<: *health
      test: [CMD, api, healthcheck]

  references-tests:
    profiles: [test]
    build:
      context: ./services/api
      target: test
    environment:
      <<: *api-environment
      APP_ENV: test
    depends_on:
      postgres: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    networks: [internal]
    restart: 'no'

  ocr-worker:
    build: ./services/ocr
    environment:
      APP_ENV: ${APP_ENV:?Set APP_ENV in .env}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      REDIS_TLS: ${REDIS_TLS:?Set REDIS_TLS in .env}
      OCR_INTERNAL_URL: http://api:8081
      OCR_INTERNAL_SECRET: ${OCR_INTERNAL_SECRET:?Set OCR_INTERNAL_SECRET}
      OCR_MIN_CONFIDENCE: ${OCR_MIN_CONFIDENCE:-0.85}
      OCR_SCAN_DPI: ${OCR_SCAN_DPI:-300}
      OCR_SCAN_RETRY_DPI: ${OCR_SCAN_RETRY_DPI:-350}
      OCR_SCAN_MAX_PASSES: ${OCR_SCAN_MAX_PASSES:-3}
      OCR_ANALYSIS_TIMEOUT_SECONDS: ${OCR_ANALYSIS_TIMEOUT_SECONDS:-120}
      OCR_PAGE_TIMEOUT_SECONDS: ${OCR_PAGE_TIMEOUT_SECONDS:-30}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-10}
      OCR_CELL_WORKERS: ${OCR_CELL_WORKERS:-}
      OCR_RAPIDOCR_ENABLED: ${OCR_RAPIDOCR_ENABLED:-true}
    depends_on:
      redis: {condition: service_healthy}
      api: {condition: service_healthy}
    networks: [internal]
    stop_grace_period: 35s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      <<: *health
      test: [CMD, python, -m, ifri_ocr.worker, healthcheck]

  ocr-tests:
    profiles: [test]
    build:
      context: .
      dockerfile: infra/ocr-validation.Dockerfile
      additional_contexts:
        ocr-runtime: service:ocr-worker
    environment:
      OCR_REFERENCE_URL: http://api:8080
      # Generated PDFs stay in tmpfs; tracked fixtures are only compared byte for byte.
      OCR_FIXTURE_OUTPUT: /tmp/ocr-artifacts
      OCR_MIN_CONFIDENCE: ${OCR_MIN_CONFIDENCE:-0.85}
      OCR_SCAN_DPI: ${OCR_SCAN_DPI:-300}
      OCR_SCAN_RETRY_DPI: ${OCR_SCAN_RETRY_DPI:-350}
      OCR_SCAN_MAX_PASSES: ${OCR_SCAN_MAX_PASSES:-3}
      OCR_PAGE_TIMEOUT_SECONDS: ${OCR_PAGE_TIMEOUT_SECONDS:-30}
      OCR_CELL_WORKERS: ${OCR_CELL_WORKERS:-}
      OCR_RAPIDOCR_ENABLED: ${OCR_RAPIDOCR_ENABLED:-true}
    depends_on:
      api: {condition: service_healthy}
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: 'no'

networks:
  internal:
    internal: true
  # A non-internal bridge is required for Docker to publish host ports.
  # Explicit 127.0.0.1 bindings above keep them local to the developer host.
  local:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:

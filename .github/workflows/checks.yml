name: Technical checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.18.1'
      - run: npm install --global npm@11.16.0
      - run: npm ci
        working-directory: apps/web
      - run: npm run build && npm run typecheck && npm run lint && npm run test && npm run format:check
        working-directory: apps/web
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.2'
          cache-dependency-path: services/api/go.sum
      - run: test -z "$(gofmt -l .)" && go vet ./... && go test ./... && go build -buildvcs=false ./cmd/api
        working-directory: services/api
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.8'
      - run: python -m pip install uv==0.13.0
      - run: uv sync --locked
        working-directory: services/ocr
      - run: uv run --no-sync pytest && uv run --no-sync ruff check . && uv run --no-sync ruff format --check .
        working-directory: services/ocr
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.8'
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 240
      - run: docker compose exec -T api db up
      - run: docker compose exec -T api db seed
      - run: docker compose exec -T api db seed
      - run: docker compose --profile test run --build --rm references-tests
      - run: python infra/scripts/smoke.py
      - run: python infra/scripts/references_smoke.py
      - run: python infra/scripts/drafts_smoke.py
      - if: always()
        run: docker compose down --volumes

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ifri-ocr"
version = "0.1.0"
description = "IFRI private transcript extraction worker"
requires-python = ">=3.14,<3.15"
dependencies = ["redis==7.4.0", "PyMuPDF==1.28.2", "RapidFuzz==3.14.6", "opencv-python-headless==4.13.0.92", "numpy==2.4.6"]

[project.scripts]
ifri-ocr = "ifri_ocr.worker:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["private-fixtures", ".venv"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
